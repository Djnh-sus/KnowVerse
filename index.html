<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>KnowVerse</title>

  <!-- Màn chờ đen kèm vòng chấm xoay chính tâm cố định (100vw/100dvh không lệch khi ẩn/hiện thanh cuộn) -->
  <style>
    html.kv-boot:not(.kv-reveal) body > *:not(#kvBoot) { visibility: hidden !important; }
    #kvBoot {
      display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; height: 100dvh;
      z-index: 99999; background: #000; box-sizing: border-box;
      align-items: center; justify-content: center;
      opacity: 0; pointer-events: none;
      transition: opacity .36s cubic-bezier(.22, 1, .36, 1);
    }
    html.kv-boot #kvBoot,
    #kvBoot.is-active {
      display: flex; opacity: 1; pointer-events: auto;
    }
    html.kv-boot #kvBoot.is-out,
    #kvBoot.is-active.is-out {
      opacity: 0; pointer-events: none;
    }
    #kvBoot.is-enter {
      opacity: 0;
    }
    .kv-boot-spinner {
      width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
      opacity: 0; transform: scale(.62);
      transition: opacity .2s ease, transform .26s cubic-bezier(.34, 1.56, .64, 1);
      will-change: transform, opacity;
    }
    #kvBoot.is-dots-on .kv-boot-spinner {
      opacity: 1; transform: scale(1);
    }
    #kvBoot.is-dots-Instant .kv-boot-spinner {
      transition: none !important;
    }
    .kv-boot-dots {
      width: 40px; height: 40px; display: block; fill: #eef1f6;
    }
    .kv-boot-dots circle {
      opacity: .12;
      animation: kvDotPulse 1.08s linear infinite;
      animation-delay: calc(var(--i) * 0.09s - 1.08s);
    }
    @keyframes kvDotPulse {
      0%   { opacity: .12; }
      12%  { opacity: 1; }
      45%  { opacity: .32; }
      78%  { opacity: .12; }
      100% { opacity: .12; }
    }
    @media (prefers-reduced-motion: reduce) {
      html:not([data-motion="full"]):not([data-motion="reduced"]) #kvBoot,
      html:not([data-motion="full"]):not([data-motion="reduced"]) .kv-boot-spinner { transition-duration: .01ms; }
    }
  </style>
  <script>
    // Chạy đồng bộ trước lần vẽ đầu tiên: bật màn chờ đen và chỉ preload khi đã có phiên chọn giao diện hoặc đang chuyển chế độ
    (function () {
      var root = document.documentElement;
      root.classList.add('kv-boot');
      try {
        var mode = null;
        var handoffRaw = sessionStorage.getItem('knowverse_switch_handoff');
        if (handoffRaw) {
          root.dataset.kvSwitching = '1';
          var handoff = JSON.parse(handoffRaw);
          if (handoff && (handoff.mode === 'lite' || handoff.mode === '3d')) mode = handoff.mode;
        } else if (localStorage.getItem('knowverse_mode_chosen_uid')) {
          var saved = localStorage.getItem('knowverse_device_ui_mode');
          if (saved === 'lite' || saved === '3d') mode = saved;
        }
        if (mode === 'lite') {
          var m = localStorage.getItem('knowverse_lite_motion');
          if (m === 'full' || m === 'reduced' || m === 'fast') root.dataset.motion = m;
        }
        var assets = {
          lite: {
            style: ['styles/lite.css', 'styles/lite-themes.css', 'styles/lite-motion.css'],
            script: ['js/lite/lite-icons.js', 'js/lite/lite-theme.js', 'js/lite/lite-app.js']
          },
          '3d': {
            style: [
              'styles/blackhole.css', 'styles/hubs.css', 'styles/grade-core.css',
              'styles/subject-system.css', 'styles/panel.css', 'styles/detail-modal.css', 'styles/responsive.css'
            ],
            script: [
              'js/engine/sky.js', 'js/engine/accretion.js', 'js/engine/lens.js', 'js/engine/blackhole.js',
              'js/ui/motion.js', 'js/ui/hubs.js', 'js/ui/grade-core.js', 'js/ui/panel.js',
              'js/ui/detail-modal.js', 'js/ui/subject-system.js', 'js/app.js'
            ]
          }
        };
        var pre = mode && assets[mode];
        if (pre) {
          ['style', 'script'].forEach(function (as) {
            pre[as].forEach(function (href) {
              var l = document.createElement('link');
              l.rel = 'preload'; l.as = as; l.href = href;
              document.head.appendChild(l);
            });
          });
        }
      } catch (e) {}
      // Chốt an toàn độc lập tại index.html: đề phòng portal.js bị cache cũ hoặc lỗi mạng
      setTimeout(function () {
        if (!root.classList.contains('kv-boot')) return;
        root.classList.remove('kv-boot', 'kv-reveal');
        var v = document.getElementById('kvBoot');
        if (v) { v.classList.remove('is-active', 'is-out', 'is-enter', 'is-dots-on'); v.hidden = true; }
      }, 6500);
    })();
  </script>

  <!-- Thứ tự CSS: thư viện -> nền tảng dùng chung -> điều phối chế độ (CSS 3D/Nhẹ nạp động theo lựa chọn) -->
  <link rel="stylesheet" href="vendor/lenis.css">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/portal.css">
</head>
<body class="locked">
  <div id="kvBoot" aria-hidden="true">
    <div class="kv-boot-spinner">
      <svg class="kv-boot-dots" viewBox="0 0 44 44" aria-hidden="true">
        <circle cx="22" cy="5.5" r="2.1" style="--i:0"/>
        <circle cx="30.25" cy="7.71" r="2.1" style="--i:1"/>
        <circle cx="36.29" cy="13.75" r="2.1" style="--i:2"/>
        <circle cx="38.5" cy="22" r="2.1" style="--i:3"/>
        <circle cx="36.29" cy="30.25" r="2.1" style="--i:4"/>
        <circle cx="30.25" cy="36.29" r="2.1" style="--i:5"/>
        <circle cx="22" cy="38.5" r="2.1" style="--i:6"/>
        <circle cx="13.75" cy="36.29" r="2.1" style="--i:7"/>
        <circle cx="7.71" cy="30.25" r="2.1" style="--i:8"/>
        <circle cx="5.5" cy="22" r="2.1" style="--i:9"/>
        <circle cx="7.71" cy="13.75" r="2.1" style="--i:10"/>
        <circle cx="13.75" cy="7.71" r="2.1" style="--i:11"/>
      </svg>
    </div>
  </div>
  <script>
    (function () {
      var v = document.getElementById('kvBoot');
      if (!v) return;
      if (document.documentElement.dataset.kvSwitching === '1') {
        v.classList.add('is-dots-Instant', 'is-dots-on');
        requestAnimationFrame(function () { v.classList.remove('is-dots-Instant'); });
      } else {
        requestAnimationFrame(function () {
          requestAnimationFrame(function () { v.classList.add('is-dots-on'); });
        });
      }
    })();
  </script>

  <!-- 1. Cảnh hố đen (WebGL2 + Canvas 2D) do engine/blackhole.js dựng khi chọn chế độ 3D -->
  <div id="scene" hidden></div>

  <!-- 2. Lớp giao diện bám theo cảnh 3D (vị trí cập nhật từng khung hình qua onFrame) -->
  <div id="ui" hidden>
    <div id="hubLayer" class="layer" aria-label="Các môn học"></div>
    <div id="gradeLayer" class="layer"></div>
    <div id="systemLayer" class="layer" aria-live="polite"></div>
    <div id="panelLayer" class="layer"></div>
  </div>

  <!-- Bảng phóng to ở giữa màn hình khi bấm vào một mục chi tiết -->
  <div id="detailOverlay" hidden></div>

  <!-- Dự phòng khi trình duyệt không có WebGL2 -->
  <div id="fallback" hidden></div>

  <!-- Khung Giao diện Nhẹ (chỉ hiện và nạp tài nguyên khi người dùng chọn Giao diện Nhẹ) -->
  <div id="liteShell" hidden>
    <div class="lite-bg" aria-hidden="true">
      <div class="lite-bg-layer"></div>
      <div class="lite-bg-layer"></div>
    </div>

    <header class="lite-header" id="liteHeader">
      <div class="lite-header-left">
        <button class="lite-back lite-press" id="liteBack" type="button" hidden aria-label="Quay về">
          <span class="lite-back-icon" id="liteBackIcon" aria-hidden="true"></span>
          <span>Quay về</span>
        </button>

        <div class="lite-grade-picker" id="liteGradePicker">
          <button class="lite-grade-trigger lite-press" id="liteGradeBtn" type="button" aria-haspopup="true" aria-expanded="false">
            <span class="lite-grade-dot" aria-hidden="true"></span>
            <span id="liteGradeLabel">Khối 12</span>
            <span class="lite-grade-chev" id="liteGradeChev" aria-hidden="true"></span>
          </button>
          <div class="lite-grade-popover" id="liteGradePopover" role="menu" hidden></div>
        </div>
      </div>
    </header>

    <main class="lite-main" id="liteMain">
      <div class="lite-sentinel" id="liteSentinel" aria-hidden="true"></div>
      <div class="lite-stage-area" id="liteView" aria-live="polite">
        <section class="lite-home-stage" id="liteHomeStage" aria-label="Danh sách các môn học"></section>
        <section class="lite-subject-stage-wrap" id="liteSubjectStage" hidden></section>
      </div>
    </main>

    <div id="liteDetailOverlay" class="lite-detail-overlay" hidden></div>
    <div id="liteToast" class="lite-toast" role="status" aria-live="polite" hidden></div>
  </div>

  <!-- 3. Thanh trên: Avatar tài khoản góc phải dùng chung cho cả 3D và Giao diện Nhẹ -->
  <header id="top">
    <div id="me" hidden>
      <button id="avatar" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Tài khoản"><span id="avatarLetter">B</span></button>
      <div id="menu" hidden>
        <div class="kv-menu-head">
          <div id="who"></div>
        </div>
        <div class="kv-menu-divider" aria-hidden="true"></div>
        <div class="kv-menu-list" role="menu">
          <button id="openAccount" class="kv-menu-item" type="button" role="menuitem">
            <span class="kv-menu-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="8" r="4"/>
                <path d="M5 20c0-3.5 3.1-6 7-6s7 2.5 7 6"/>
              </svg>
            </span>
            <span class="kv-menu-text">
              <span class="kv-menu-title">Thông tin tài khoản</span>
              <span class="kv-menu-sub">Hồ sơ &amp; bài đăng của bản thân</span>
            </span>
          </button>

          <button id="openSettings" class="kv-menu-item" type="button" role="menuitem">
            <span class="kv-menu-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"/>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.6.79 1 1.51 1H21a2 2 0 1 1 0 4h-.09c-.72 0-1.25.4-1.51 1z"/>
              </svg>
            </span>
            <span class="kv-menu-text">
              <span class="kv-menu-title">Cài đặt</span>
              <span class="kv-menu-sub">Đổi giao diện &amp; thiết lập</span>
            </span>
          </button>

          <button id="logout" class="kv-menu-item is-danger" type="button" role="menuitem">
            <span class="kv-menu-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                <polyline points="16 17 21 12 16 7"/>
                <line x1="21" y1="12" x2="9" y2="12"/>
              </svg>
            </span>
            <span class="kv-menu-text">
              <span class="kv-menu-title">Đăng xuất</span>
            </span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Nút Quay về nằm giữa phía dưới khi đang xem một môn (ẩn đi khi mở bảng chi tiết) -->
  <button id="back" class="back-btn" type="button" hidden aria-label="Quay về">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>Quay về</span>
  </button>

  <p id="hint" hidden>Bấm số khối trong hố đen để đổi khối · Bấm tên môn để vào học</p>

  <!-- 4. Đăng nhập (Supabase qua Vite /src/main.js, tự dự phòng cục bộ khi mở qua file:///) -->
  <div id="login" role="dialog" aria-modal="true" aria-labelledby="lTitle">
    <form id="loginForm" class="sheet">
      <h1 id="lTitle">Đăng nhập</h1>
      <p class="muted">Đăng nhập để vào học</p>
      <button type="button" id="google" class="btn ghost">Tiếp tục với Google</button>
      <div class="or"><span>hoặc</span></div>
      <label>Gmail<input id="email" type="email" autocomplete="username" placeholder="ten@gmail.com" required></label>
      <label>Mật khẩu<input id="pass" type="password" autocomplete="current-password" required></label>
      <button class="btn" type="submit">Đăng nhập</button>
      <p class="note"></p>
    </form>
  </div>

  <div id="toast" role="status" hidden></div>

  <!-- Thư viện chuyển động và dữ liệu dùng chung -->
  <script src="vendor/gsap.min.js"></script>
  <script src="vendor/CustomEase.min.js"></script>
  <script src="vendor/lenis.min.js"></script>
  <script src="js/subjects-data.js"></script>

  <!-- Điều phối đăng nhập, chọn chế độ và nạp tài nguyên 3D / Giao diện Nhẹ theo lựa chọn -->
  <script src="js/portal.js"></script>
  <!-- Kết nối Supabase Auth & hồ sơ (chạy qua Vite / HTTP; tự bỏ qua nếu mở trực tiếp bằng file:///) -->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
